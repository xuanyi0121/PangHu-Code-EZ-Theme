name: Build EZ-Theme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          npm install
          npm install defu --save
          npm install --legacy-peer-deps

      # 4. 构建项目
      - name: Build project
        run: npm run build

      # ✅ 5. 手动复制 config 文件到构建目录
      - name: Copy config file to dist
        run: |
          mkdir -p dist/config
          cp -r src/config/index.js dist/config/index.js
          echo "✅ Copied src/config/index.js into dist/config/"

      # 6. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ez-theme-dist
          path: dist
